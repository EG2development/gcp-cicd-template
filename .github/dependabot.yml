# Weekly pull requests for Google provider updates in both Terraform roots.
# Major versions are left for a deliberate upgrade (docs/how-to/update-the-google-provider.md).
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /
      - /cicd
    schedule:
      interval: weekly
    groups:
      google-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
